[workspace]
resolver = "2"
members = [
    "apps/cloudflare-backup-worker",
    "apps/cloudflare-worker",
    "apps/desktop/src-tauri",
    "crates/application",
    "crates/backup-port",
    "crates/contracts",
    "crates/domain",
    "crates/storage-d1",
    "crates/storage-memory",
    "crates/storage-port",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
