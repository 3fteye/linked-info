name: Cloudflare backup Worker build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build precompiled Worker
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install pinned worker-build
        run: cargo install worker-build --version 0.8.0 --locked

      - name: Build Worker
        working-directory: apps/cloudflare-backup-worker
        run: worker-build --release

      - name: Upload precompiled Worker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: cloudflare-backup-worker-${{ github.sha }}
          path: apps/cloudflare-backup-worker/build/**
          if-no-files-found: error
          retention-days: 3
