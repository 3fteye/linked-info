name: Resolve Wasmtime lockfile

on:
  push:
    branches: [io/capsule-notes-timeline]
    paths: [.github/workflows/resolve-wasmtime-lockfile.yml]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Resolve only the Wasmtime patch upgrade
        run: cargo update -p wasmtime --precise 47.0.4
      - name: Verify lockfile consistency
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --no-deps | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasmtime-47.0.4-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
