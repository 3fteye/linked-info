name: Resolve security lockfile
on:
  push:
    branches: [fix/dependency-security-october]
    paths:
      - Cargo.toml
      - .github/workflows/resolve-security-lock.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Resolve patched dependencies without building
        shell: pwsh
        run: |
          cargo update -p wasmtime --precise 48.0.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo update -p quinn-proto --precise 0.11.18
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
