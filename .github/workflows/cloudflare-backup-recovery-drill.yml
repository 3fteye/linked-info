name: Cloudflare backup recovery drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-drill:
    name: Live encrypted backup recovery drill
    runs-on: windows-latest
    timeout-minutes: 20
    environment: cloudflare-backup-drill
    env:
      LINKED_INFO_BACKUP_DRILL_ENDPOINT: ${{ vars.LINKED_INFO_BACKUP_DRILL_ENDPOINT }}
      LINKED_INFO_BACKUP_DRILL_TOKEN: ${{ secrets.LINKED_INFO_BACKUP_DRILL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require isolated drill credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LINKED_INFO_BACKUP_DRILL_ENDPOINT)) {
            throw "The isolated drill endpoint is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:LINKED_INFO_BACKUP_DRILL_TOKEN)) {
            throw "The isolated drill token is not configured."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Restore a synthetic encrypted workspace through R2
        run: >-
          cargo test
          -p linked-info-desktop
          --lib
          workspace_file::tests::live_cloudflare_backup_restores_in_a_fresh_configuration
          -- --ignored --exact
