name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Core, frontend and Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint core crates
        run: >-
          cargo clippy
          -p linked-info-contracts
          -p linked-info-domain
          -p linked-info-storage-port
          -p linked-info-storage-memory
          -p linked-info-application
          --all-targets -- -D warnings

      - name: Test core crates
        run: >-
          cargo test
          -p linked-info-contracts
          -p linked-info-domain
          -p linked-info-storage-port
          -p linked-info-storage-memory
          -p linked-info-application

      - name: Check Cloudflare Worker
        run: cargo clippy -p cloudflare-worker --target wasm32-unknown-unknown -- -D warnings

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Test frontend workspace lifecycle
        working-directory: apps/desktop
        run: pnpm test

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

  desktop-windows:
    name: Windows desktop check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check Windows desktop target
        run: cargo check -p linked-info-desktop

      - name: Test Windows desktop lifecycle
        run: cargo test -p linked-info-desktop --lib
