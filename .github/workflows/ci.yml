name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arrangement-cold-start:
    name: Cold-start canvas arrangement
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Test cold-start evidence classification
        run: node --test scripts/test-arrangement-cold-start.test.mjs

      - name: Verify arrangement cold-start control and fix
        run: node scripts/test-arrangement-cold-start.mjs

  quality:
    name: Windows core, frontend and Worker
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check Rust lockfile consistency
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Rust formatting
        id: rust_format
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Lint core crates
        run: >-
          cargo clippy
          -p linked-info-backup-port
          -p linked-info-capture-inbox
          -p linked-info-contracts
          -p linked-info-domain
          -p linked-info-extension-contracts
          -p linked-info-extension-host-protocol
          -p linked-info-extension-host
          -p linked-info-extension-sdk
          -p linked-info-extension-tool
          -p linked-info-storage-port
          -p linked-info-storage-memory
          -p linked-info-application
          --all-targets -- -D warnings

      - name: Test core crates
        run: >-
          cargo test
          -p linked-info-backup-port
          -p linked-info-capture-inbox
          -p linked-info-contracts
          -p linked-info-domain
          -p linked-info-extension-contracts
          -p linked-info-extension-host-protocol
          -p linked-info-extension-host
          -p linked-info-extension-sdk
          -p linked-info-extension-tool
          -p linked-info-storage-port
          -p linked-info-storage-memory
          -p linked-info-application

      - name: Build and exercise external Rust extension example
        shell: pwsh
        run: ./.github/scripts/test-rust-extension-sdk.ps1

      - name: Check Cloudflare node API Worker
        run: >-
          cargo clippy
          -p cloudflare-worker
          --target wasm32-unknown-unknown -- -D warnings

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Audit production frontend dependencies
        working-directory: apps/desktop
        run: pnpm audit --prod --audit-level high

      - name: Test dependency license policy
        run: node --test scripts/check-dependency-licenses.test.mjs

      - name: Test sensitive logging policy
        run: node --test scripts/check-sensitive-logging.test.mjs

      - name: Test document import benchmark scorer
        run: >-
          node --test
          scripts/document-import-benchmark.test.mjs
          scripts/prepare-public-document-import-benchmark.test.mjs

      - name: Validate document import benchmark fixtures
        run: node scripts/document-import-benchmark.mjs validate

      - name: Check sensitive logging boundary
        run: node scripts/check-sensitive-logging.mjs

      - name: Test native capsule runner safety gates
        run: node --test scripts/native-capsule-safety.test.mjs

      - name: Check dependency licenses and Rust sources
        run: node scripts/check-dependency-licenses.mjs

      - name: Install verified cargo-cyclonedx
        shell: pwsh
        run: ./.github/scripts/install-cargo-cyclonedx.ps1 -DestinationDirectory "$env:RUNNER_TEMP\cargo-cyclonedx"

      - name: Generate and validate CycloneDX SBOMs
        shell: pwsh
        run: ./.github/scripts/generate-sbom.ps1 -OutputDirectory "artifacts\sbom"

      - name: Upload CycloneDX SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linked-info-sbom-${{ github.sha }}
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Test frontend workspace lifecycle
        working-directory: apps/desktop
        run: pnpm test

      - name: Test canvas interactions in Microsoft Edge
        working-directory: apps/desktop
        run: pnpm test:e2e

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Build independent capture frontend
        working-directory: apps/desktop
        run: pnpm build:capture

      # Formatting still fails the job, but must not hide unrelated test
      # results when all executable verification is performed in CI.
      - name: Enforce Rust formatting result
        if: ${{ always() && steps.rust_format.outcome == 'failure' }}
        shell: pwsh
        run: throw 'Rust formatting failed; see Check Rust formatting'

  desktop-windows:
    name: Windows desktop check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test Windows desktop runner fixtures
        shell: pwsh
        run: ./.github/scripts/test-windows-desktop-fixtures.ps1

      - name: Test Windows package verification fixtures
        shell: pwsh
        run: ./.github/scripts/test-windows-package-fixtures.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check Windows desktop target
        run: cargo check -p linked-info-desktop -p linked-info-capture

      - name: Test Windows desktop lifecycle
        shell: pwsh
        run: ./.github/scripts/test-windows-desktop.ps1
