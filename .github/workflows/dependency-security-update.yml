name: Dependency security lock preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dependency-security-update.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.head_ref == 'fix/dependency-security-november' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Record baseline features and resolve patched versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'dependency-security-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $packages = @('ctutils', 'rustls', 'rustls-webpki', 'webpki-roots', 'wasmtime', 'zip')
          foreach ($package in $packages) {
            cargo tree --locked --workspace --target x86_64-pc-windows-msvc -e features -i $package > (Join-Path $evidence "before-$package.txt")
            if ($LASTEXITCODE -ne 0) { throw "Baseline dependency tree failed: $package" }
          }
          $manifest = Get-Content Cargo.toml -Raw
          if (-not $manifest.Contains('version = "48.0.5"') -or -not $manifest.Contains('version = "8.6"')) {
            throw 'Unexpected baseline manifest; this preparation is scoped to the November baseline.'
          }
          $manifest.Replace('version = "48.0.5"', 'version = "48.0.8"').Replace('version = "8.6"', 'version = "9.0"') | Set-Content Cargo.toml -NoNewline
          $updates = @(
            @{ Name = 'wasmtime'; Version = '48.0.8' },
            @{ Name = 'zip'; Version = '9.0.0' },
            @{ Name = 'ctutils'; Version = '0.4.4' },
            @{ Name = 'rustls'; Version = '0.23.46' },
            @{ Name = 'rustls-webpki'; Version = '0.103.16' },
            @{ Name = 'webpki-roots'; Version = '1.0.10' }
          )
          foreach ($update in $updates) {
            cargo update -p $update.Name --precise $update.Version
            if ($LASTEXITCODE -ne 0) { throw "Dependency resolution failed: $($update.Name)" }
          }
          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Updated lockfile is inconsistent' }
          foreach ($package in $packages) {
            cargo tree --locked --workspace --target x86_64-pc-windows-msvc -e features -i $package > (Join-Path $evidence "after-$package.txt")
            if ($LASTEXITCODE -ne 0) { throw "Updated dependency tree failed: $package" }
          }
          Copy-Item Cargo.toml,Cargo.lock $evidence
          git diff --stat
          git diff -- Cargo.toml Cargo.lock > (Join-Path $evidence 'resolution.diff')
      - name: Preserve lockfile and feature evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-security-lock-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-security-evidence
          if-no-files-found: error
          retention-days: 14
