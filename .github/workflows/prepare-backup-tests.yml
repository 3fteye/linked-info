name: Prepare backup integration tests
on:
  push:
    branches: [test/backup-recovery-roundtrip]
    paths:
      - .github/workflows/prepare-backup-tests.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-backup-tests
          path: |
            apps/desktop/src-tauri/src/s3_backup_target/test_service.rs
            apps/desktop/src-tauri/src/workspace_file/tests/backup_roundtrip.rs
          if-no-files-found: error
          retention-days: 3
