name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Prepare Windows local LLM runtime
        shell: pwsh
        run: ./.github/scripts/prepare-llama-runtime.ps1

      - name: Build Windows portable executable
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Assemble Windows portable runtime
        shell: pwsh
        run: Copy-Item -LiteralPath apps/desktop/src-tauri/resources/llama-runtime -Destination target/release/llama-runtime -Recurse -Force

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: linked-info-windows
          path: |
            target/release/linked-info-desktop.exe
            target/release/llama-runtime/**
          if-no-files-found: error
