name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Test dependency license policy
        run: node --test scripts/check-dependency-licenses.test.mjs

      - name: Check dependency licenses and Rust sources
        run: node scripts/check-dependency-licenses.mjs

      - name: Install verified cargo-cyclonedx
        shell: pwsh
        run: ./.github/scripts/install-cargo-cyclonedx.ps1 -DestinationDirectory "$env:RUNNER_TEMP\cargo-cyclonedx"

      - name: Generate and validate CycloneDX SBOMs
        shell: pwsh
        run: ./.github/scripts/generate-sbom.ps1 -OutputDirectory "artifacts\sbom"

      - name: Prepare Windows local LLM runtime
        shell: pwsh
        run: ./.github/scripts/prepare-llama-runtime.ps1

      - name: Build Windows portable executable
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Assemble Windows portable runtime
        shell: pwsh
        run: Copy-Item -LiteralPath apps/desktop/src-tauri/resources/llama-runtime -Destination target/release/llama-runtime -Recurse -Force

      - name: Write package checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath target/release/linked-info-desktop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *linked-info-desktop.exe" | Set-Content -LiteralPath target/release/linked-info-windows.sha256 -Encoding ascii

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linked-info-windows
          path: |
            target/release/linked-info-desktop.exe
            target/release/linked-info-windows.sha256
            target/release/llama-runtime/**
            artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 3
