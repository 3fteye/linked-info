[workspace]

[package]
name = "linked-info-example-extension"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
linked-info-extension-sdk = { path = "../../crates/extension-sdk" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
